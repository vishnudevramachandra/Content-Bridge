services:
  wordpress-db:
    image: mariadb:11.4
    container_name: contentbridge-wordpress-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${WORDPRESS_DB_NAME}
      MARIADB_USER: ${WORDPRESS_DB_USER}
      MARIADB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${WORDPRESS_DB_ROOT_PASSWORD}
    volumes:
      - wordpress_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  wordpress:
    build: ./wordpress
    container_name: contentbridge-wordpress
    restart: unless-stopped
    depends_on:
      wordpress-db:
        condition: service_healthy
    ports:
      - "${WORDPRESS_PORT}:80"
    environment:
      WORDPRESS_DB_HOST: wordpress-db
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
      # Consumed by wp-content/seed/seed.sh (via `docker compose exec wordpress ...`),
      # not by WordPress core itself.
      WP_URL: http://localhost:${WORDPRESS_PORT}
      WP_TITLE: ${WP_TITLE}
      WP_ADMIN_USER: ${WP_ADMIN_USER}
      WP_ADMIN_PASSWORD: ${WP_ADMIN_PASSWORD}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL}
    volumes:
      - wordpress_data:/var/www/html
      # Bind-mount our own plugin from the repo so it's live-edited on the host,
      # while default plugins (Akismet, Hello Dolly) stay in the named volume.
      - ./wordpress/wp-content/plugins/contentbridge-fields:/var/www/html/wp-content/plugins/contentbridge-fields
      # Seed script + content dump. Bind-mounted (not baked into the image) so
      # they can be edited/regenerated without a rebuild.
      - ./wordpress/seed:/var/www/html/wp-content/seed
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: seeds the DB automatically once WordPress is up, then exits.
  # No manual `docker compose exec ... seed.sh` step needed.
  wordpress-seed:
    build: ./wordpress
    depends_on:
      wordpress:
        condition: service_healthy
    restart: "no"
    entrypoint: ["bash", "wp-content/seed/seed.sh"]
    working_dir: /var/www/html
    environment:
      WP_URL: http://localhost:${WORDPRESS_PORT}
      WP_TITLE: ${WP_TITLE}
      WP_ADMIN_USER: ${WP_ADMIN_USER}
      WP_ADMIN_PASSWORD: ${WP_ADMIN_PASSWORD}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL}
      WORDPRESS_DB_HOST: wordpress-db
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
    volumes:
      - wordpress_data:/var/www/html
      - ./wordpress/wp-content/plugins/contentbridge-fields:/var/www/html/wp-content/plugins/contentbridge-fields
      - ./wordpress/seed:/var/www/html/wp-content/seed

  # The Strapi app itself is fully ours (unlike wordpress/ above, which builds
  # on the official CMS image) — package.json, src/, config/ are all checked
  # into strapi/, so this Dockerfile just installs deps and runs it, the same
  # way you'd run it on a host.
  strapi:
    build: ./strapi
    container_name: contentbridge-strapi
    restart: unless-stopped
    ports:
      - "${STRAPI_PORT}:1337"
    environment:
      HOST: 0.0.0.0
      PORT: 1337
      APP_KEYS: ${STRAPI_APP_KEYS}
      API_TOKEN_SALT: ${STRAPI_API_TOKEN_SALT}
      ADMIN_JWT_SECRET: ${STRAPI_ADMIN_JWT_SECRET}
      JWT_SECRET: ${STRAPI_JWT_SECRET}
      TRANSFER_TOKEN_SALT: ${STRAPI_TRANSFER_TOKEN_SALT}
      ENCRYPTION_KEY: ${STRAPI_ENCRYPTION_KEY}
      DATABASE_CLIENT: ${STRAPI_DB_CLIENT}
      DATABASE_FILENAME: ${STRAPI_DB_FILENAME}
    volumes:
      # sqlite db file + uploaded media are runtime state, not source —
      # named volumes, not bind-mounted, so they survive `down`/`up` but
      # aren't tracked by git.
      - strapi_tmp:/opt/app/.tmp
      - strapi_uploads:/opt/app/public/uploads
      # Bind-mount our own content-type schemas + custom code from the repo
      # so edits on the host are live in the container (still needs a
      # restart to take effect — same as wordpress-seed vs. wordpress's
      # plugin bind-mount, this is the "source of truth" half of the app).
      - ./strapi/src:/opt/app/src
      - ./strapi/config:/opt/app/config
      - ./strapi/database:/opt/app/database
      # Seed + dump scripts, mounted here too (not just on strapi-seed) so
      # `docker compose exec strapi bash seed/dump.sh` works the same way
      # `docker compose exec wordpress bash wp-content/seed/dump.sh` does.
      - ./strapi/seed:/opt/app/seed
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1337/_health"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: seeds the catalog automatically once Strapi is up, then exits —
  # same shape as wordpress-seed. A second in-process Strapi instance briefly
  # sharing the same sqlite file with the already-running `strapi` container
  # is safe here (verified empirically): both `strapi admin:create-user` and
  # a raw concurrent write succeeded fine against the live volume as long as
  # writes are quick and sequential, which is all this does.
  strapi-seed:
    build: ./strapi
    depends_on:
      strapi:
        condition: service_healthy
    restart: "no"
    entrypoint: ["bash", "seed/seed.sh"]
    working_dir: /opt/app
    environment:
      APP_KEYS: ${STRAPI_APP_KEYS}
      API_TOKEN_SALT: ${STRAPI_API_TOKEN_SALT}
      ADMIN_JWT_SECRET: ${STRAPI_ADMIN_JWT_SECRET}
      JWT_SECRET: ${STRAPI_JWT_SECRET}
      TRANSFER_TOKEN_SALT: ${STRAPI_TRANSFER_TOKEN_SALT}
      ENCRYPTION_KEY: ${STRAPI_ENCRYPTION_KEY}
      DATABASE_CLIENT: ${STRAPI_DB_CLIENT}
      DATABASE_FILENAME: ${STRAPI_DB_FILENAME}
      STRAPI_ADMIN_EMAIL: ${STRAPI_ADMIN_EMAIL}
      STRAPI_ADMIN_PASSWORD: ${STRAPI_ADMIN_PASSWORD}
    volumes:
      - strapi_tmp:/opt/app/.tmp
      - strapi_uploads:/opt/app/public/uploads
      - ./strapi/src:/opt/app/src
      - ./strapi/config:/opt/app/config
      - ./strapi/database:/opt/app/database
      # Seed script + catalog data. Bind-mounted (not baked into the image)
      # so they can be edited/regenerated without a rebuild — same reasoning
      # as wordpress-seed's ./wordpress/seed mount.
      - ./strapi/seed:/opt/app/seed

  # Lightweight DB browser so we can look at raw tables (wp_posts, wp_postmeta, etc.)
  # without needing phpMyAdmin's heavier footprint.
  adminer:
    image: adminer:4
    container_name: contentbridge-adminer
    restart: unless-stopped
    depends_on:
      - wordpress-db
    ports:
      - "${ADMINER_PORT}:8080"

volumes:
  wordpress_db_data:
  wordpress_data:
  strapi_tmp:
  strapi_uploads:
