services:
  wordpress-db:
    image: mariadb:11.4
    container_name: contentbridge-wordpress-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${WORDPRESS_DB_NAME}
      MARIADB_USER: ${WORDPRESS_DB_USER}
      MARIADB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${WORDPRESS_DB_ROOT_PASSWORD}
    volumes:
      - wordpress_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  wordpress:
    image: wordpress:6.7-php8.3-apache
    container_name: contentbridge-wordpress
    restart: unless-stopped
    depends_on:
      wordpress-db:
        condition: service_healthy
    ports:
      - "${WORDPRESS_PORT}:80"
    environment:
      WORDPRESS_DB_HOST: wordpress-db
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
    volumes:
      - wordpress_data:/var/www/html

  # Lightweight DB browser so we can look at raw tables (wp_posts, wp_postmeta, etc.)
  # without needing phpMyAdmin's heavier footprint.
  adminer:
    image: adminer:4
    container_name: contentbridge-adminer
    restart: unless-stopped
    depends_on:
      - wordpress-db
    ports:
      - "${ADMINER_PORT}:8080"

volumes:
  wordpress_db_data:
  wordpress_data:
